<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登入本機 AI</title><style>body{background:#13141c;color:#eee;font:16px system-ui;margin:0;display:grid;place-items:center;min-height:100vh}main{width:min(380px,85vw);padding:28px;border:1px solid #ffffff25;border-radius:20px}label{display:block;margin:18px 0}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:7px;border-radius:9px;border:1px solid #777;background:#222430;color:white}button{background:#b7a0ff;color:#191525;cursor:pointer}small,p{color:#bcb7cb;line-height:1.6}a{color:#b7a0ff}</style><link rel="stylesheet" href="login-intro.css"><main class="login-card"><h1 id="title">登入</h1><p id="intro">每個帳號的對話與附件分開保存。</p><form><label>帳號<input name="username" autocomplete="username" required pattern="[a-zA-Z0-9_.-]{3,40}" maxlength="40"></label><small>3–40 個英數字，可含底線、句點與連字號。</small><label>密碼<input name="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required></label><label id="inviteLabel" hidden>邀請碼<input name="invitation" autocomplete="off"></label><button>登入</button></form><button id="switch" type="button">使用邀請碼建立帳號</button><p id="status" role="status"></p><small>共用電腦使用完畢後請登出。</small></main><script src="login-intro.js"></script><script>
let mode='login';const form=document.querySelector('form'),statusBox=document.getElementById('status');
function render(){document.getElementById('title').textContent=mode==='setup'?'建立管理員':mode==='register'?'接受邀請':'登入';form.querySelector('button').textContent=mode==='login'?'登入':'建立帳號';document.getElementById('inviteLabel').hidden=mode!=='register';form.invitation.required=mode==='register';form.password.autocomplete=mode==='login'?'current-password':'new-password';document.getElementById('switch').hidden=mode==='setup';document.getElementById('switch').textContent=mode==='login'?'使用邀請碼建立帳號':'返回登入';if(mode==='setup')document.getElementById('intro').textContent='僅限本機首次設定。建立後，原有對話將歸到你的管理員帳號。';}
document.getElementById('switch').onclick=()=>{mode=mode==='login'?'register':'login';statusBox.textContent='';render();};
fetch('/api/auth/status').then(r=>r.json()).then(d=>{if(d.user)location.replace('/');else if(d.setup){mode='setup';render();}}).catch(()=>statusBox.textContent='無法連線，請確認網站已啟動');
form.onsubmit=async e=>{e.preventDefault();form.querySelector('button').disabled=true;try{const r=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const data=await r.json();if(!r.ok)throw Error(data.error);location.replace('/');}catch(e){statusBox.textContent=e.message;}finally{form.querySelector('button').disabled=false;}};
</script></html>
